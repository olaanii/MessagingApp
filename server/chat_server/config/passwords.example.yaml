# Copy this file to `passwords.yaml` for local development and replace every
# placeholder with a stable secret. Do not commit real secrets.
shared:
  # At least 10 characters. Keep stable for a deployment or existing refresh
  # tokens become invalid.
  jwtRefreshTokenHashPepper: replace-with-refresh-token-pepper

  # HMAC signing key for Serverpod JWT access tokens.
  jwtHmacSha512PrivateKey: replace-with-long-random-hmac-key

  # At least 10 characters. Keep stable for email password/code hashes.
  emailSecretHashPepper: replace-with-email-secret-pepper

  # The full Firebase service account JSON as a single quoted string.
  # Example: '{"type":"service_account","project_id":"..."}'
  firebaseServiceAccountKey: '{"type":"service_account","project_id":"replace-me"}'
