name: chat_server
description: Starting point for a Serverpod server.
# version: 1.0.0
# homepage: https://www.example.com

publish_to: none

resolution: workspace

environment:
  sdk: '^3.8.0'

dependencies:
  serverpod: 3.4.5
  serverpod_auth_idp_server: ^3.4.5
  dart_firebase_admin: ^0.4.1

dependency_overrides:
  pointycastle: ^4.0.0
  dart_jsonwebtoken: ^3.0.0

dev_dependencies:
  lints: '>=3.0.0 <7.0.0'
  serverpod_test: 3.4.5
  test: ^1.25.5

serverpod:
  scripts:
    # Starts the server and applies migrations
    start: dart bin/main.dart --apply-migrations

    # Build the Flutter web app and copy it to the server's web directory.
    # Windows uses xcopy since flutter's --output flag doesn't work there.
    # See: https://github.com/flutter/flutter/issues/157886
    # Host web UI lives in repo `chat/`; output copied into this server.
    flutter_build:
      windows: >-
        (if exist web\app rmdir /S /Q web\app)
        & cd /D ..\..\chat
        && flutter build web --base-href /app/ --wasm
        && xcopy /E /I /Y build\web ..\server\chat_server\web\app
      posix: |
        cd ../../chat && flutter build web --base-href /app/ --wasm --output ../server/chat_server/web/app
