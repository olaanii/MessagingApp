# E2EE key distribution bundles (ADR-0002).
class: DeviceKeyBundle
table: device_keys
fields:
  authUserId: UuidValue
  deviceId: String
  bundleJson: String
  createdAt: DateTime, default=now
indexes:
  device_key_auth_device_idx:
    fields: authUserId, deviceId
    unique: true
  device_key_auth_user_idx:
    fields: authUserId
