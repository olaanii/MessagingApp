name: Deploy Staging

on:
  push:
    branches: [ "develop" ]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests (use with caution)'
        required: false
        default: 'false'

jobs:
  test:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.skip_tests != 'true' }}

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chat_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Install Serverpod CLI
      - name: Install Serverpod CLI
        run: dart pub global activate serverpod_cli

      # Generate Serverpod code
      - name: Generate Serverpod code
        run: serverpod generate
        working-directory: server

      # Test Serverpod backend
      - name: Install server dependencies
        run: dart pub get
        working-directory: server/chat_server

      - name: Run server tests
        run: dart test
        working-directory: server/chat_server
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: chat_test
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres

      # Test Flutter app
      - name: Install Flutter dependencies
        run: flutter pub get
        working-directory: chat

      - name: Analyze Flutter code
        run: flutter analyze
        working-directory: chat

      - name: Run Flutter tests
        run: flutter test
        working-directory: chat

  deploy_backend:
    runs-on: ubuntu-latest
    needs: test
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      # Install Serverpod CLI
      - name: Install Serverpod CLI
        run: dart pub global activate serverpod_cli

      # Generate Serverpod code
      - name: Generate Serverpod code
        run: serverpod generate
        working-directory: server

      # Install dependencies
      - name: Install server dependencies
        run: dart pub get
        working-directory: server/chat_server

      # Build server
      - name: Build server
        run: dart compile exe bin/main.dart -o chat_server
        working-directory: server/chat_server

      # Apply database migrations
      - name: Apply database migrations
        run: |
          echo "Applying database migrations to staging environment..."
          # Install PostgreSQL client
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          
          # Apply migrations using psql
          PGPASSWORD=${{ secrets.STAGING_DB_PASSWORD }} psql \
            -h ${{ secrets.STAGING_DB_HOST }} \
            -p ${{ secrets.STAGING_DB_PORT }} \
            -U ${{ secrets.STAGING_DB_USER }} \
            -d ${{ secrets.STAGING_DB_NAME }} \
            -f server/chat_server/migrations/apply_all.sql || true
          
          echo "Migrations applied successfully"
        continue-on-error: false

      # Deploy to staging server
      # TODO: Replace with your actual deployment method
      # Options include:
      #   - SSH deployment: scp + systemctl restart
      #   - Docker: build and push to registry
      #   - Cloud Run: gcloud run deploy
      #   - AWS ECS: aws ecs update-service
      - name: Deploy backend to staging
        run: |
          echo "Backend deployment placeholder"
          echo "Server binary: server/chat_server/chat_server"
          echo "Configure your deployment target in this step"
          echo "Example: scp chat_server user@staging-server:/opt/chat_server/"
          echo "Example: ssh user@staging-server 'systemctl restart chat_server'"

  build_app:
    runs-on: ubuntu-latest
    needs: test
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Install Serverpod CLI
      - name: Install Serverpod CLI
        run: dart pub global activate serverpod_cli

      # Generate Serverpod client code
      - name: Generate Serverpod client code
        run: serverpod generate
        working-directory: server

      # Install Flutter dependencies
      - name: Install dependencies
        run: flutter pub get
        working-directory: chat

      # Build Android APK
      - name: Build APK (staging)
        run: |
          flutter build apk --release \
            --dart-define=ENV=staging \
            --dart-define=SERVERPOD_HOST=${{ secrets.STAGING_SERVERPOD_HOST }} \
            --dart-define=SERVERPOD_PORT=${{ secrets.STAGING_SERVERPOD_PORT }}
        working-directory: chat

      # Upload APK artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-apk
          path: chat/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  deploy_app:
    runs-on: ubuntu-latest
    needs: [deploy_backend, build_app]

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: staging-apk

      # TODO: Replace this step with your actual staging deployment.
      # Options include:
      #   - Firebase App Distribution:
      #       run: |
      #         npm install -g firebase-tools
      #         firebase appdistribution:distribute app-release.apk \
      #           --app ${{ secrets.FIREBASE_APP_ID_STAGING }} \
      #           --groups "testers" \
      #           --token ${{ secrets.FIREBASE_TOKEN }}
      #   - AWS S3 for distribution
      #   - Google Play Internal Track
      #   - TestFlight for iOS
      - name: Deploy app to staging
        run: |
          echo "APK ready for deployment: app-release.apk"
          echo "Configure your deployment target in this step."
          echo "Example: Firebase App Distribution, Google Play Internal Track, etc."
