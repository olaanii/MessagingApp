# Serverpod Backend CI Pipeline
# Runs tests, analysis, and code generation for the Serverpod backend

name: Serverpod Backend CI

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'server/**'
      - 'docs/protocol/**'
      - '.github/workflows/dart.yml'
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'server/**'
      - 'docs/protocol/**'

jobs:
  serverpod_backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chat_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      # Install Serverpod CLI
      - name: Install Serverpod CLI
        run: dart pub global activate serverpod_cli

      # Server dependencies
      - name: Install server dependencies
        run: dart pub get
        working-directory: server/chat_server

      # Client dependencies
      - name: Install client dependencies
        run: dart pub get
        working-directory: server/chat_client

      # Generate Serverpod code
      - name: Generate Serverpod code
        run: serverpod generate
        working-directory: server

      # Verify generated code is up to date
      - name: Check for uncommitted generated code
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "Error: Generated code is out of date. Run 'serverpod generate' locally and commit changes."
            git status
            git diff
            exit 1
          fi

      # Analyze server code
      - name: Analyze server code
        run: dart analyze --fatal-infos
        working-directory: server/chat_server

      # Analyze client code
      - name: Analyze client code
        run: dart analyze --fatal-infos
        working-directory: server/chat_client

      # Run server tests
      - name: Run server tests
        run: dart test
        working-directory: server/chat_server
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: chat_test
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres

      # Run client tests
      - name: Run client tests
        run: dart test
        working-directory: server/chat_client
